<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Element selector</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- A class selector is used to pick a specific element to style -->
     <p>
       HELLO WORLD
     </p>
     <p class="jk">cse 24</p>
     <p class="jk">class element</p>
     <p id="l1">ABESEC</p>
     <div>hello world</div>
</body>
</html>
